[package]
name = "egglog_python"
version = "14.0.0"
edition = "2024"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "egglog"
crate-type = ["cdylib"]

[dependencies]
# Maturin enables `pyo3/extension-module` through pyproject.toml. Keep it out of
# the base feature set so `cargo test` links against libpython on Unix.
pyo3 = "0.29"
prost = "=0.14.4"
egglog = { git = "https://github.com/egraphs-good/egglog.git", rev = "f766cabf3f0602ed6908b343e608c88ec725593e", default-features = false }
egglog-experimental = { git = "https://github.com/egraphs-good/egglog-experimental.git", rev = "b1b9b6149078a7400d5cdeb1f1b6994a7b4a4eeb", default-features = false }
pyo3-log =  "*"
uuid = { version = "1.18", features = ["v4"] }
base64 = "0.23"

# enable debug symbols for easier profiling
[profile.release]
debug = true
