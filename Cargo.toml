[package]
name = "egglog_python"
version = "14.0.0"
edition = "2024"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "egglog"
crate-type = ["cdylib"]

[dependencies]
# Maturin enables `pyo3/extension-module` through pyproject.toml. Keep it out of
# the base feature set so `cargo test` links against libpython on Unix.
pyo3 = "0.29"
prost = "=0.14.4"
egglog = { git = "https://github.com/egraphs-good/egglog", rev = "998e60380e254d00b29651e88f2065fb33851a2f", default-features = false }
egglog-experimental = { git = "https://github.com/egraphs-good/egglog-experimental.git", rev = "7a277e7fb217b30794b0bb2995ecc158983c5692", default-features = false }
pyo3-log =  "*"
uuid = { version = "1.18", features = ["v4"] }
base64 = "0.23"

# enable debug symbols for easier profiling
[profile.release]
debug = true
