[package]
name = "egglog_python"
version = "14.0.0"
edition = "2024"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "egglog"
crate-type = ["cdylib"]

[dependencies]
# Maturin enables `pyo3/extension-module` through pyproject.toml. Keep it out of
# the base feature set so `cargo test` links against libpython on Unix.
pyo3 = { version = "0.29", features = ["num-bigint", "num-rational", "indexmap"] }
num-rational = "*"
indexmap = "2.12"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry-stdout = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = "0.32"
egglog = { git = "https://github.com/egraphs-good/egglog", rev = "6fba0ecd4cfbb7cb1f97a3f50e854299a3d66a48", default-features = false }
egglog-ast = { git = "https://github.com/egraphs-good/egglog", rev = "6fba0ecd4cfbb7cb1f97a3f50e854299a3d66a48" }
egglog-core-relations = { git = "https://github.com/egraphs-good/egglog", rev = "6fba0ecd4cfbb7cb1f97a3f50e854299a3d66a48" }
egglog-reports = { git = "https://github.com/egraphs-good/egglog", rev = "6fba0ecd4cfbb7cb1f97a3f50e854299a3d66a48" }
egglog-bridge = { git = "https://github.com/egraphs-good/egglog", rev = "6fba0ecd4cfbb7cb1f97a3f50e854299a3d66a48" }
egglog-experimental = { git = "https://github.com/egraphs-good/egglog-experimental.git", rev = "6fe57a918559fa47064f4917c38597d61bf8d7c4", default-features = false }
egraph-serialize = { version = "0.3", features = ["serde", "graphviz"] }
serde_json = "1"
pyo3-log =  "*"
log = "0.4"
lalrpop-util = { version = "0.23", features = ["lexer"] }
ordered-float = "5"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = "0.3"
uuid = { version = "1.18", features = ["v4"] }
base64 = "0.23"

# enable debug symbols for easier profiling
[profile.release]
debug = true
